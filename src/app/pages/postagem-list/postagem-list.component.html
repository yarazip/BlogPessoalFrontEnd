@if (usuarioId !== undefined) {
  <app-feed-postagens
    [autor]="usuarioId"
    [gerenciar]="true"
    mensagemVazia="Você ainda não publicou nada. Comente no feed ou escreva uma postagem de blog."
  >
    <header class="minhas-topo">
      <h2>Minhas postagens</h2>
      <a routerLink="/postagens/nova" class="minhas-nova"><app-icon name="plus" /> Postagem de blog</a>
    </header>
  </app-feed-postagens>
}
