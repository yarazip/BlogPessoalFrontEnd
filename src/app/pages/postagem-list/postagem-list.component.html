@if (usuarioId !== undefined) {
  <app-feed-postagens
    [autor]="usuarioId"
    mensagemVazia="Você ainda não publicou nada. Faça um rabisco no feed ou escreva um rascunho."
  >
    <header class="minhas-topo">
      <h2>Minhas postagens</h2>
      <a routerLink="/postagens/nova" class="minhas-nova"><app-icon name="plus" /> Novo rascunho</a>
    </header>
  </app-feed-postagens>
}
