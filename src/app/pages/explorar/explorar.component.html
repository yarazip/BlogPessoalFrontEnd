<div class="postagens-feed">
  <p *ngIf="isLoading" class="mensagem-info">Carregando postagens...</p>
  <p *ngIf="mensagemErro" class="mensagem-erro" role="alert">{{ mensagemErro }}</p>
  <p *ngIf="!isLoading && !mensagemErro && postagens.length === 0" class="mensagem-info">
    Ainda não há postagens.
  </p>

  <article class="postagem" *ngFor="let postagem of postagens">
    <div class="postagem-header">
      <img
        [src]="postagem.usuario?.foto || fotoPadrao"
        alt="Foto de {{ postagem.usuario?.nome }}"
        class="foto-perfil"
        loading="lazy"
      />

      <div class="info-usuario">
        <h4>{{ postagem.usuario?.nome }}</h4>
        <small>Publicado em: {{ postagem.data | dateBr }}</small>
      </div>
    </div>

    <h3>{{ postagem.titulo }}</h3>
    <p class="texto-postagem">{{ postagem.texto }}</p>
  </article>

  <button *ngIf="haMais" type="button" class="btn-carregar-mais" [disabled]="carregandoMais" (click)="carregarMais()">
    {{ carregandoMais ? "Carregando..." : "Carregar mais" }}
  </button>
</div>
