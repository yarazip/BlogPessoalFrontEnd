<div class="post-detail-container">
  @if (isLoading) {
    <div class="text-center">
      <div class="spinner-border" role="status">
        <span class="visually-hidden">Carregando...</span>
      </div>
    </div>
  }

  @if (mensagemErro) {
    <div class="mensagem-erro" role="alert">{{ mensagemErro }}</div>
  }

  @if (!isLoading && postagem) {
    <div class="post-content">
      <div class="post-header">
        <h1>{{ postagem.titulo }}</h1>
        <div class="post-meta">
          <span class="badge">{{ postagem.tema?.descricao || 'Sem tema' }}</span>
          <span>{{ postagem.data | dateBr }}</span>
        </div>
      </div>
      <div class="card-text mb-4 texto-postagem">{{ postagem.texto }}</div>
      @if (ehAutor) {
        <div class="post-actions">
          <button type="button" (click)="editar(postagem.id!)" class="btn btn-warning">
            <app-icon name="edit" /> Editar
          </button>
          <button type="button" (click)="excluir(postagem.id!)" class="btn btn-danger">
            <app-icon name="trash" /> Excluir
          </button>
        </div>
      }
    </div>
  }
</div>
