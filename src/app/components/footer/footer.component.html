<footer>
  <div class="footer-conteudo">
    <p class="footer-marca">Blogify</p>
    <p class="footer-assinatura">Feito por Yara Rosa</p>

    <nav class="footer-links" aria-label="Contato">
      @for (link of links; track link.rotulo) {
        <a [href]="link.url" [attr.target]="link.externo ? '_blank' : null" [attr.rel]="link.externo ? 'noopener noreferrer' : null">
          <app-icon [name]="link.icone" />
          <span>{{ link.rotulo }}</span>
        </a>
      }
    </nav>
  </div>

  <p class="footer-direitos">© {{ ano }} Blogify. Todos os direitos reservados.</p>
</footer>
