<header [class.fixed]="isHomePage">
  <div class="header-container">
    <!-- Logo -->
    <a routerLink="/" class="logo-link">
      <app-logo class="logo-wordmark" />
    </a>
    
    <nav class="main-nav" [class.mobile-open]="isMobileMenuOpen">
      <div class="nav-links">
        <a routerLink="/" fragment="home" (click)="closeMobileMenu()">Página Inicial</a>
        <a routerLink="/" fragment="sobre" (click)="closeMobileMenu()">Sobre</a>
        <a routerLink="/" fragment="recursos" (click)="closeMobileMenu()">Recursos</a>

        <!-- Só aparece no menu do celular; no desktop os botões ficam em .header-buttons -->
        <div class="nav-acoes">
          <a routerLink="/login" class="login-btn" (click)="closeMobileMenu()">Entrar</a>
          <a routerLink="/register" class="get-started-btn" (click)="closeMobileMenu()">Começar</a>
        </div>
      </div>

      <button class="mobile-menu-toggle" (click)="toggleMobileMenu()" aria-label="Menu" [attr.aria-expanded]="isMobileMenuOpen">
        <span class="hamburger-line"></span>
        <span class="hamburger-line"></span>
        <span class="hamburger-line"></span>
      </button>
    </nav>

    <div class="header-right">
      <button (click)="toggleTheme()" class="theme-toggle" aria-label="Alternar tema">
        <app-icon name="moon" class="icon-moon" />
        <app-icon name="sun" class="icon-sun" />
      </button>
      <div class="header-buttons">
        <a routerLink="/login" class="login-btn">Entrar</a>
        <a routerLink="/register" class="get-started-btn">Começar</a>
      </div>
    </div>
  </div>
</header>
