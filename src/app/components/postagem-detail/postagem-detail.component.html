<div class="post-detail-container">
  <div *ngIf="isLoading" class="text-center">
    <div class="spinner-border" role="status">
      <span class="visually-hidden">Carregando...</span>
    </div>
  </div>

  <div *ngIf="mensagemErro" class="mensagem-erro" role="alert">{{ mensagemErro }}</div>

  <div *ngIf="!isLoading && postagem" class="post-content">
    <div class="post-header">
      <h1>{{ postagem.titulo }}</h1>
      <div class="post-meta">
        <span class="badge">{{ postagem.tema?.descricao || 'Sem tema' }}</span>
        <span>{{ postagem.data | dateBr }}</span>
      </div>
    </div>

    <div class="card-text mb-4 texto-postagem">{{ postagem.texto }}</div>

    <div *ngIf="ehAutor" class="post-actions">
      <button type="button" (click)="editar(postagem.id!)" class="btn btn-warning">
        <i class="fas fa-edit"></i> Editar
      </button>
      <button type="button" (click)="excluir(postagem.id!)" class="btn btn-danger">
        <i class="fas fa-trash"></i> Excluir
      </button>
    </div>
  </div>
</div>
