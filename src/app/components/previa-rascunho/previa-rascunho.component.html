@if (vazia()) {
  <p class="previa-vazia">Escreva um título e um texto para ver como o rascunho vai aparecer.</p>
} @else {
  <section class="previa-bloco" aria-labelledby="previa-feed">
    <h3 class="previa-rotulo" id="previa-feed">No mural</h3>
    <article class="previa-post">
      <p class="previa-autor">
        <strong>{{ autor() }}</strong> <span>· hoje</span>
      </p>
      @if (titulo().trim()) {
        <h4 class="previa-titulo" [style.font-family]="pilha()" [style.font-weight]="pesoDoTitulo()">{{ titulo() }}</h4>
      }
      <p class="previa-texto" [class.resumido]="noFeed().resumido" [style.font-family]="pilha()"><app-texto-com-emojis [texto]="noFeed().texto" /></p>
      @if (noFeed().resumido) {
        <span class="previa-ler-mais">Ler mais</span>
      }
      @if (tema()) {
        <span class="previa-tema">#{{ tema() }}</span>
      }
    </article>
  </section>
}
