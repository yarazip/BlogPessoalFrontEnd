<header>
  <div class="header-container">
    <a routerLink="/explorar" class="logo-link">
      <app-logo class="logo-wordmark" />
    </a>

    <nav class="main-nav" [class.mobile-open]="isMobileMenuOpen">
      <div class="nav-links">
        <a routerLink="/explorar" routerLinkActive="active" (click)="closeMobileMenu()">Mural</a>
        <a
          [routerLink]="['/perfil', idDoUsuario]"
          routerLinkActive="active"
          (click)="closeMobileMenu()"
        >
          <app-icon name="user" /> Eu
        </a>
        <a
          routerLink="/dashboard"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          (click)="closeMobileMenu()"
          >Novidades</a
        >

        <!-- Só no menu do celular: lá o tema sai da barra e entra aqui (no desktop ele é o botão redondo de .header-right) -->
        <div class="nav-acoes">
          <button type="button" class="acao-menu" (click)="toggleTheme()">
            <app-icon [name]="escuro() ? 'sun' : 'moon'" /> {{ escuro() ? 'Modo claro' : 'Modo escuro' }}
          </button>
        </div>
      </div>

      <button
        class="mobile-menu-toggle"
        (click)="toggleMobileMenu()"
        aria-label="Menu"
        [attr.aria-expanded]="isMobileMenuOpen"
      >
        <span class="hamburger-line"></span>
        <span class="hamburger-line"></span>
        <span class="hamburger-line"></span>
      </button>
    </nav>

    <div class="header-right">
      <!-- no celular vira o botão flutuante do canto inferior direito (e some no próprio editor de rascunho novo) -->
      <a routerLink="/postagens/nova" routerLinkActive="no-editor" class="novo-rascunho" aria-label="Novo rascunho" title="Novo rascunho">
        <app-icon name="plus" />
      </a>
      <app-sino />
      <button
        (click)="toggleTheme()"
        class="theme-toggle"
        aria-label="Alternar tema"
      >
        <app-icon name="moon" class="icon-moon" />
        <app-icon name="sun" class="icon-sun" />
      </button>
      <button class="logout-btn" (click)="logout()" aria-label="Sair">
        <app-icon name="logout" />
        <span class="logout-text">Sair</span>
      </button>
    </div>
  </div>
</header>
